<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NASVAY Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">NASVAY</a><b>ADMIN PANEL</b><a href="/">Store</a></header><main class="section"><div id="admin"></div></main><script>
const money=k=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(k/100);
async function api(u,o={}){let r=await fetch(u,{...o,headers:{"Content-Type":"application/json",...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
async function load(){try{const me=await api("/api/me");if(me.user.role!=="admin")throw Error("Admin only");const [orders,products]=await Promise.all([api("/api/admin/orders"),api("/api/products")]);document.querySelector("#admin").innerHTML=`<h1>Dashboard</h1><h2>Orders</h2><table class="admin-table"><thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>${orders.map(o=>`<tr><td>#${o.id}</td><td>${o.customer_name}<br>${o.email}</td><td>${money(o.total)}</td><td>${o.payment_status}</td><td><select onchange="status(${o.id},this.value)">${["pending","processing","shipped","delivered","cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table><h2>Products</h2><p>${products.length} active products</p><button class="btn dark" onclick="addProduct()">Add Product</button><div class="grid">${products.map(p=>`<article class="product"><img src="${p.image}"><div class="info"><b>${p.name}</b><p>${money(p.price)} · stock ${p.stock}</p><button onclick="deactivate(${p.id})">Deactivate</button></div></article>`).join("")}</div>`}catch(e){document.querySelector("#admin").innerHTML=`<h2>${e.message}</h2><a class="btn dark" href="/#account">Log in</a>`}}
async function status(id,status){await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status})})}
async function deactivate(id){await api("/api/admin/products/"+id,{method:"DELETE"});load()}
async function addProduct(){let name=prompt("Product name");if(!name)return;let price=prompt("Price in naira, e.g. 85000");let image=prompt("Image URL");let stock=prompt("Stock",10);await api("/api/admin/products",{method:"POST",body:JSON.stringify({name,price:Number(price)*100,image,stock:Number(stock)})});load()}
load();</script></body></html>
