<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — NASVAY</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">NASVAY</a><nav><a href="/">Home</a><button onclick="location.href='/'">Cart</button></nav></header><main class="section"><div id="product"></div></main><script>const money=k=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(k/100);const id=new URLSearchParams(location.search).get("id");fetch("/api/products/"+id).then(r=>r.json()).then(p=>{document.title=p.name+" — NASVAY";document.querySelector("#product").innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:35px;max-width:1000px;margin:auto"><img src="${p.image}" style="width:100%;max-height:700px;object-fit:cover"><div><small>NASVAY COLLECTION</small><h1 style="font:48px Georgia">${p.name}</h1><h2>${money(p.price)}</h2><p style="line-height:1.8">${p.description}</p><p>Stock: ${p.stock}</p><button class="btn dark" onclick="add(${p.id})">ADD TO CART</button></div></div>`;window.add=id=>{let c=JSON.parse(localStorage.getItem("nasvay_cart")||"[]"),x=c.find(i=>i.product_id===id);if(x)x.quantity++;else c.push({product_id:id,quantity:1});localStorage.setItem("nasvay_cart",JSON.stringify(c));alert("Added to cart. Return to the shop to checkout.")}});</script></body></html>
